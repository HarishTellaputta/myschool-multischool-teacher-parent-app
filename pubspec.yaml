
name: myschool_app
description: "MySchool Parent and Teacher Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5

  # Parent App packages
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pinput: ^5.0.0
  carousel_slider: ^5.1.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  iconsax_flutter: ^1.0.0
  http: ^1.5.0
  share_plus: ^10.1.4
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6

  # Teacher App packages
  dio: ^5.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
